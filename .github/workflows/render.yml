name: Render animation

# push / pull_request -> fast "smoke" test: validates the full 25-hour scene and
#                        renders + encodes a 2 s clip (frames 1220-1279).
# workflow_dispatch    -> full "preview" or "final" render of all 1388 frames.
on:
  push:
    paths: ["animation.py", ".github/workflows/render.yml", ".github/actions/**"]
  pull_request:
    paths: ["animation.py", ".github/workflows/render.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = 540x960 render, every 2nd frame, 12 samples (~15 min). final = full 1080x1920, every frame, 32 samples, motion blur (~21 CPU-hours split across parallel jobs)."
        type: choice
        options: [preview, final]
        default: preview
      chunks:
        description: "Parallel render jobs (0 = auto: 8 for preview, 30 for final). Final needs >= 8 to stay under the 6 h job limit."
        type: string
        default: "0"
      frames:
        description: "Optional frame range START-END (1-1388) for a partial render; empty = the whole video"
        type: string
        default: ""
      samples:
        description: "Override Cycles samples (0 = mode default)"
        type: string
        default: "0"
      blender_series:
        description: "Blender series to install (newest patch release is used)"
        type: string
        default: "5.2"

concurrency:
  group: render-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'smoke' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BLENDER_SERIES: ${{ inputs.blender_series || '5.2' }}
  MODE: ${{ inputs.mode || 'preview' }}
  SAMPLES: ${{ inputs.samples || '0' }}
  BLENDER_FLAGS: -b --factory-startup --python-exit-code 1

jobs:
  validate:
    name: Validate & build scene
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      chunk_count: ${{ steps.plan.outputs.chunk_count }}
      scene_key: ${{ steps.keys.outputs.scene_key }}
      blender_version: ${{ steps.blender.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve run settings
        id: settings
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            frames="${{ inputs.frames }}"
            chunks="${{ inputs.chunks }}"
          else
            frames="1220-1279"   # smoke test: the superyacht reveal + coin shower
            chunks="2"
          fi
          if ! [[ "$chunks" =~ ^[0-9]+$ ]]; then
            echo "::error title=Bad input::chunks must be a whole number, got '$chunks'"; exit 1
          fi
          if ! [[ "$SAMPLES" =~ ^[0-9]+$ ]]; then
            echo "::error title=Bad input::samples must be a whole number, got '$SAMPLES'"; exit 1
          fi
          if [ "$chunks" = "0" ]; then
            if [ "$MODE" = "final" ]; then chunks=30; else chunks=8; fi
          fi
          if [ "$chunks" -gt 256 ]; then
            echo "::error title=Bad input::GitHub allows at most 256 matrix jobs (got $chunks)"; exit 1
          fi
          echo "frames=$frames" >> "$GITHUB_OUTPUT"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"

      - name: Validate purchase table (no Blender needed)
        run: python3 animation.py --validate

      - name: Plan render chunks
        id: plan
        run: |
          python3 animation.py --plan --mode "$MODE" --chunks "${{ steps.settings.outputs.chunks }}" \
            --frames "${{ steps.settings.outputs.frames }}" > plan.json
          echo "matrix=$(jq -c '{include: .chunks}' plan.json)" >> "$GITHUB_OUTPUT"
          echo "chunk_count=$(jq '.chunks | length' plan.json)" >> "$GITHUB_OUTPUT"
          jq . plan.json
          {
            echo "### Render plan ($MODE)"
            jq -r '"- frames \(.first)-\(.last) of \(.total_frames), step \(.frame_step) -> \(.rendered_frames) rendered frames",
                   "- render size \(.render_width)x\(.render_height), output \(.width)x\(.height) H.264 @ \(.fps) fps, \(.expected_seconds) s",
                   "- \(.chunks | length) parallel render jobs"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender
        with:
          series: ${{ env.BLENDER_SERIES }}

      - name: Cache keys
        id: keys
        run: echo "scene_key=scene-${{ steps.blender.outputs.version }}-${{ hashFiles('animation.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached scene
        id: scene-cache
        uses: actions/cache/restore@v4
        with:
          path: scene.blend
          key: ${{ steps.keys.outputs.scene_key }}

      - name: Build scene (all 25 hours) and validate it
        if: steps.scene-cache.outputs.cache-hit != 'true'
        run: |
          blender $BLENDER_FLAGS -P animation.py -- --validate-scene --mode "$MODE" --save "$PWD/scene.blend" 2>&1 \
            | grep -vE "DeprecationWarning|use_nodes = True"
          test -s scene.blend || { echo "::error title=Scene build failed::scene.blend was not written"; exit 1; }

      - name: Validate cached scene
        if: steps.scene-cache.outputs.cache-hit == 'true'
        run: blender $BLENDER_FLAGS scene.blend -P animation.py -- --use-open-scene --validate-scene

      - name: Save scene to cache
        if: steps.scene-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scene.blend
          key: ${{ steps.keys.outputs.scene_key }}

      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: |
            scene.blend
            plan.json
          retention-days: 3
          if-no-files-found: error

  render:
    name: Render ${{ matrix.id }} (frames ${{ matrix.start }}-${{ matrix.end }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: scene

      - name: Restore cached segment
        id: seg-cache
        uses: actions/cache/restore@v4
        with:
          path: segments/seg_${{ matrix.id }}.mp4
          key: seg-${{ needs.validate.outputs.scene_key }}-${{ env.MODE }}-s${{ env.SAMPLES }}-${{ matrix.start }}-${{ matrix.end }}

      - name: Set up Blender
        if: steps.seg-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-blender
        with:
          # exact version resolved once by the validate job: the Blender cache
          # hits without querying download.blender.org from every render job
          version: ${{ needs.validate.outputs.blender_version }}

      - name: Render frames on CPU (Cycles)
        if: steps.seg-cache.outputs.cache-hit != 'true'
        run: |
          echo "Rendering on $(nproc) CPU threads, no GPU"
          blender $BLENDER_FLAGS scene.blend -P animation.py -- --use-open-scene \
            --mode "$MODE" --samples "$SAMPLES" --threads "$(nproc)" \
            --render-frames "${{ matrix.start }}-${{ matrix.end }}" --frames-dir frames 2>&1 \
            | grep --line-buffered -vE "Sample [0-9]+/|Remaining:|DeprecationWarning"

      - name: Validate rendered frames
        if: steps.seg-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'EOF'
          import glob, json, struct, sys
          plan = json.load(open("plan.json"))
          want = (plan["render_width"], plan["render_height"])
          files = sorted(glob.glob("frames/frame_*.png"))
          expected = ${{ matrix.count }}
          if len(files) != expected:
              sys.exit(f"::error title=Missing frames::expected {expected} PNGs, found {len(files)}")
          for f in files:
              with open(f, "rb") as fh:
                  head = fh.read(24)
              if head[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit(f"::error title=Corrupt frame::{f} is not a PNG")
              size = struct.unpack(">II", head[16:24])
              if size != want:
                  sys.exit(f"::error title=Wrong frame size::{f} is {size}, expected {want}")
          print(f"{len(files)} frames OK at {want[0]}x{want[1]}")
          EOF

      - name: Install FFmpeg
        if: steps.seg-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && ffmpeg -version | head -n 1

      - name: Encode segment (H.264, 1080x1920, 30 fps)
        if: steps.seg-cache.outputs.cache-hit != 'true'
        run: |
          step=$(jq .frame_step plan.json)
          mkdir -p segments
          # high-quality intermediate; upscales preview frames and repeats them back to 30 fps
          ffmpeg -hide_banner -loglevel error -y \
            -framerate "$((30 / step))" -pattern_type glob -i 'frames/frame_*.png' \
            -vf "scale=1080:1920:flags=lanczos,fps=30,format=yuv420p" \
            -c:v libx264 -preset medium -crf 12 -r 30 \
            "segments/seg_${{ matrix.id }}.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "segments/seg_${{ matrix.id }}.mp4"

      - name: Save segment to cache
        if: steps.seg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: segments/seg_${{ matrix.id }}.mp4
          key: seg-${{ needs.validate.outputs.scene_key }}-${{ env.MODE }}-s${{ env.SAMPLES }}-${{ matrix.start }}-${{ matrix.end }}

      - uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.id }}
          path: segments/seg_${{ matrix.id }}.mp4
          retention-days: 3
          if-no-files-found: error

  encode:
    name: Encode final MP4
    needs: [validate, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scene

      - uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          path: segments
          merge-multiple: true

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null

      - name: Check all segments arrived
        run: |
          want=${{ needs.validate.outputs.chunk_count }}
          have=$(ls segments/seg_*.mp4 | wc -l)
          if [ "$have" != "$want" ]; then
            echo "::error title=Missing segments::expected $want rendered segments, got $have"; exit 1
          fi

      - name: Concatenate and encode
        run: |
          mkdir -p out
          for f in $(ls segments/seg_*.mp4 | sort); do echo "file '$PWD/$f'"; done > concat.txt
          name="money-doubling-${MODE}"
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -r 30 \
            -c:v libx264 -preset slow -crf 18 -profile:v high -level:v 4.2 \
            -movflags +faststart "out/${name}.mp4"
          ffmpeg -hide_banner -loglevel error -y -ss "$(jq '.expected_seconds * 0.5' plan.json)" -i "out/${name}.mp4" \
            -frames:v 1 -q:v 3 "out/${name}-poster.jpg"
          cp plan.json out/
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Validate video
        run: |
          f="out/${NAME}.mp4"
          probe=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -show_entries format=duration \
            -of json "$f")
          echo "$probe" | jq .
          codec=$(jq -r '.streams[0].codec_name' <<<"$probe")
          w=$(jq -r '.streams[0].width' <<<"$probe"); h=$(jq -r '.streams[0].height' <<<"$probe")
          pix=$(jq -r '.streams[0].pix_fmt' <<<"$probe"); fps=$(jq -r '.streams[0].r_frame_rate' <<<"$probe")
          dur=$(jq -r '.format.duration' <<<"$probe"); want=$(jq .expected_seconds plan.json)
          fail=0
          [ "$codec" = "h264" ] || { echo "::error title=Wrong codec::$codec (expected h264)"; fail=1; }
          [ "$w" = "1080" ] && [ "$h" = "1920" ] || { echo "::error title=Wrong size::${w}x${h} (expected 1080x1920)"; fail=1; }
          [ "$pix" = "yuv420p" ] || { echo "::error title=Wrong pixel format::$pix (expected yuv420p)"; fail=1; }
          [ "$fps" = "30/1" ] || { echo "::error title=Wrong frame rate::$fps (expected 30/1)"; fail=1; }
          python3 -c "import sys; d,w=float('$dur'),float('$want'); sys.exit(0 if abs(d-w) <= 0.2 else 1)" \
            || { echo "::error title=Wrong duration::${dur}s (expected ${want}s)"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          {
            echo "### Video ($MODE)"
            echo "- \`${NAME}.mp4\`: ${w}x${h} ${codec} ${pix} @ ${fps} fps, ${dur}s, $(du -h "$f" | cut -f1)"
            echo "- Blender ${{ needs.validate.outputs.blender_version }}, Cycles CPU"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/
          retention-days: 14
          if-no-files-found: error
